name: Watchdog

# Каждый день проверяет, что серверы GTA5RP отвечают так, как ждёт лаунчер,
# и не вышла ли новая версия официального лаунчера. При проблеме открывает issue,
# когда всё снова в порядке — закрывает его.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check GTA5RP API
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python tools/watchdog.py
          echo "failed=$?" >> "$GITHUB_OUTPUT"
      - name: Open or update the issue
        if: steps.check.outputs.failed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Watchdog: что-то изменилось на серверах GTA5RP"
          body="$(cat watchdog-report.md)

          Запуск: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: Close the issue when everything works again
        if: steps.check.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Watchdog: что-то изменилось на серверах GTA5RP"
          for num in $(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number'); do
            gh issue close "$num" --comment "Проверка снова проходит: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
